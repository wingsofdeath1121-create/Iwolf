<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b27">
<title>Iw0lf — IELTS Werewolf RPG</title>
<style>
:root{--ink:#21160f;--wood:#734325;--gold:#f2c77d;--cream:#fff2d5;--green:#163d32;--line:#e3c18e;--panel:rgba(14,29,28,.91);--red:#a84032}*{box-sizing:border-box}body{margin:0;background:#0d1b1c;color:var(--cream);font-family:Georgia,'Trebuchet MS',sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.scene{min-height:100vh;background-size:cover;background-position:center;position:relative;isolation:isolate}.scene:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,15,16,.2),rgba(5,15,16,.74));z-index:-1}.wrap{max-width:1280px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-weight:900;letter-spacing:3px;color:#f7ddb0;text-shadow:0 3px 0 #392115;font-size:clamp(20px,4vw,32px)}.brand small{display:block;font:12px system-ui;letter-spacing:2px;color:#d4c8aa}.badge{border:1px solid #dfbf89;border-radius:999px;padding:8px 13px;background:#1b2927c9;font:700 12px system-ui;color:#f5d79d}.panel{background:var(--panel);border:2px solid var(--line);box-shadow:0 8px 30px #0008,inset 0 0 0 4px #f8d99d14;border-radius:15px;padding:clamp(16px,3vw,28px);backdrop-filter:blur(4px)}.hero{min-height:calc(100vh - 96px);display:grid;place-items:center}.setup{width:min(940px,100%)}h1,h2,h3{color:#ffe2a8;margin-top:0}h1{font-size:clamp(27px,5vw,48px);text-align:center;text-shadow:0 3px #301a10;margin-bottom:8px}h2{font-size:clamp(21px,3vw,30px)}.sub{text-align:center;color:#e7d3ad;margin:0 0 24px;line-height:1.6}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:16px 0}.field{display:flex;flex-direction:column;gap:6px;font:13px system-ui;color:#f3dcad}.field input,.input,select{width:100%;background:#101d1d;color:#fff4da;border:1px solid #b59365;border-radius:8px;padding:11px}.btn{border:1px solid #f1cf95;background:linear-gradient(#a86433,#75401f);color:#fff3d7;border-radius:9px;padding:12px 18px;font-weight:800;box-shadow:0 3px #3f2414;transition:.15s}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn.secondary{background:#263c37}.btn.danger{background:linear-gradient(#b4523c,#733023)}.btn.gold{background:linear-gradient(#e8bc68,#a26b2c);color:#28180c}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.wide{width:100%}.center{text-align:center}.muted{color:#cfbea0;font:14px/1.6 system-ui}.micro{font:12px/1.5 system-ui;color:#c8bc9f}.notice{padding:12px 14px;background:#102523;border-left:3px solid var(--gold);border-radius:6px;font:13px/1.55 system-ui;color:#e4d4b5}.phasebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0}.timer{font:900 24px ui-monospace,monospace;color:#ffdf9f}.gamegrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.mainpanel{min-height:420px}.sidebar{display:flex;flex-direction:column;gap:14px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:18px 0}.playercard{border:1px solid #d3b17f;border-radius:10px;background:#172725d9;padding:10px;text-align:center;cursor:pointer;transition:.15s}.playercard:hover,.playercard.selected{outline:2px solid #f4cd80;transform:translateY(-2px)}.playercard.dead{opacity:.4;filter:grayscale(1)}.playercard img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:7px;border:1px solid #9f7748;background:#30251c}.playercard strong{display:block;margin:7px 0 2px}.playercard small{font:11px system-ui;color:#d4c5a7}.rolecard{width:min(260px,70vw);height:360px;margin:16px auto;background:#21180f;border:2px solid #d4a66a;border-radius:15px;overflow:hidden;box-shadow:0 14px 35px #0009;cursor:pointer;position:relative;transition:transform .5s}.rolecard img{width:100%;height:100%;object-fit:cover}.rolecard.back img{object-fit:cover}.rolecard .roledesc{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,#170e09 22%);text-shadow:0 2px #000}.rolecard .roledesc b{font-size:20px;color:#ffe0a2}.rolecard .roledesc p{font:13px/1.4 system-ui;margin:6px 0 0}.chat{height:270px;overflow:auto;background:#101d1dcc;border:1px solid #718b7e;border-radius:8px;padding:12px;font:14px/1.5 system-ui}.chat .system{color:#f6d68f}.chat .wolf{color:#f58e7e}.alive{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #ffffff1a;font:13px system-ui}.alive.dead{text-decoration:line-through;opacity:.5}.meter{height:9px;background:#26312d;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#72ba72,#f1c66b);width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.message{font-size:clamp(17px,2vw,24px);line-height:1.5;color:#fff0d1}.grave{font-family:Georgia,serif;text-align:center;background:#171311e8;border:1px solid #ae8658;padding:20px;border-radius:10px}.grave h2{color:#e5c690;letter-spacing:2px}.score{border-collapse:collapse;width:100%;font:13px system-ui}.score td,.score th{padding:9px;border-bottom:1px solid #ffffff21;text-align:left}.score th{color:#f6d48b}.hidden{display:none!important}.rulelist{font:13px/1.55 system-ui;padding-left:18px;color:#ebd9b8}.rolepill{display:inline-block;border-radius:20px;padding:4px 9px;margin:3px;background:#533721;color:#ffe0a5;font:12px system-ui}.error{color:#ffa58e}.overlay{position:fixed;inset:0;background:#050b0be8;display:grid;place-items:center;padding:20px;z-index:5}.modal{width:min(680px,100%)}@media(max-width:800px){.gamegrid,.cols{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.mainpanel{min-height:350px}}@media(max-width:500px){.sidebar{grid-template-columns:1fr}.wrap{padding:12px}.phasebar{align-items:flex-start;flex-direction:column}}

.hub{width:min(520px,100%);padding:clamp(22px,4vw,38px);background:rgba(14,32,29,.9)}.hub h1{font-size:clamp(40px,8vw,76px);letter-spacing:10px;margin:0;text-shadow:0 4px #301a10}.hub .sub{font-size:18px;letter-spacing:2px;margin-bottom:22px}.hub .sub span{font-size:14px;letter-spacing:0}.hubactions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.linkbtn{display:block;margin:18px auto 6px;border:0;background:transparent;color:#efd7aa;text-decoration:underline;cursor:pointer;font:13px system-ui}.lobby{width:min(850px,100%)}.code{font:900 clamp(38px,7vw,64px) ui-monospace,monospace;text-align:center;letter-spacing:12px;color:#ffe2a8;padding:12px}.hub .field{margin:12px 0}
.guide-modal{width:min(960px,100%);max-height:90vh;overflow:auto;background:rgba(20,32,29,.98)}.guide-modal h2{margin:10px 0 0}.guide-head{justify-content:space-between;position:sticky;top:-28px;z-index:1;background:#14201d;padding:8px 0 14px}.guide-modal details{border-top:1px solid #8b704b;padding:14px 4px}.guide-modal summary{color:#ffe0a2;font-weight:800;font-size:18px;cursor:pointer}.guide-table{width:100%;border-collapse:collapse;margin:14px 0;font:13px/1.45 system-ui}.guide-table th,.guide-table td{border-bottom:1px solid #ffffff2a;text-align:left;padding:9px;vertical-align:top}.guide-table th{color:#f2d08d}.guide-scroll{overflow:auto}.guide-roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px;margin-top:12px}.guide-role{background:#ffffff0a;border:1px solid #ffffff1c;border-radius:8px;padding:10px}.guide-role b{color:#ffdfa0}.guide-role p{font:13px/1.45 system-ui;margin:5px 0 0;color:#e2d2b2}.guide-list{font:14px/1.6 system-ui;color:#ebdab9;padding-left:23px}.guide-list li{padding:4px 0}.guide-sublist{margin:5px 0 6px 6px;padding-left:22px;list-style:disc}.guide-modal .notice{margin-top:16px}@media(max-width:550px){.guide-modal{padding:16px}.guide-head{top:-16px}.guide-table{font-size:12px}.guide-table th,.guide-table td{padding:7px}}
.test-toggle{display:flex;align-items:center;gap:12px;margin:4px 0 16px;padding:12px 14px;border:1px solid #d0ab72;border-radius:10px;background:#172725d9;cursor:pointer}.test-toggle input{width:20px;height:20px;accent-color:#e5b965}.test-toggle span{display:grid;gap:4px}.test-toggle b{color:#ffe0a2;font:700 14px system-ui}.test-toggle small{color:#cbbd9e;font:12px/1.4 system-ui}.night-scene{aspect-ratio:16/9;min-height:230px;width:100%;margin:14px 0;border:2px solid #9dcbd1;border-radius:10px;background-size:cover;background-position:center;box-shadow:0 6px 22px #0009}.seer-scene{border-color:#92d8f1}.wolf-scene{border-color:#dd9c77}.target-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px;margin:12px 0}.target-grid .playercard{font:inherit;color:inherit}.target-grid .playercard img{max-height:118px;object-fit:contain}.role-action{margin-top:14px}
</style>
</head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.0"></script><script src="supabase/config.js"></script>
<script>
const AS='assets/';
const roles={wolf:{name:'Ma Sói',img:'ma soi.jpg',team:'wolf',text:'Cùng phe Sói chọn một người để cắn mỗi đêm.'},alpha:{name:'Sói Đầu Đàn',img:'soi dau dan.jpg',team:'wolf',text:'Phiếu cắn có trọng số 1.5.'},white:{name:'Sói Trắng',img:'soi trang.jpg',team:'wolf',text:'Thuộc phe Sói. Miễn nhiễm với phát nỏ của Thợ Săn; Tiên Tri soi ra là phe Dân.'},seer:{name:'Tiên Tri',img:'Tien tri.png',team:'village',text:'Mỗi đêm soi một người, biết người đó thuộc phe Dân hay phe Sói.'},witch:{name:'Phù Thủy',img:'phu thuy.jpg',team:'village',text:'Sau khi biết người chết trong đêm, được cứu tối đa một người.'},angel:{name:'Thiên Sứ',img:'thien su.jpg',team:'village',text:'Bảo hộ một người mỗi đêm; không chọn bản thân hoặc người đã bảo hộ đêm trước.'},hunter:{name:'Thợ Săn',img:'tho san.jpg',team:'village',text:'Chọn một mục tiêu ngắm nỏ. Nếu Thợ Săn chết, phát bắn được kích hoạt.'},elder:{name:'Già Làng',img:'gia lang.jpg',team:'village',text:'Có 2 mạng. Mỗi lần bị Sói cắn hoặc Thợ Săn bắn nỏ mất 1 mạng. Nếu bị treo cổ, dân mất năng lực đặc biệt.'},hybrid:{name:'Người Lai Sói',img:'lai soi.jpg',team:'village',text:'Nếu bị Sói cắn, sống sót và chuyển phe Sói từ đêm tiếp theo.'},villager:{name:'Thường Dân',img:'dan thuong.jpg',team:'village',text:'Thảo luận và tìm Sói trong buổi sáng.'}};
const configs={6:['wolf','seer','witch','angel','villager','villager'],7:['alpha','wolf','seer','witch','hunter','villager','villager'],8:['alpha','white','seer','witch','angel','villager','villager','villager'],9:['alpha','white','wolf','seer','witch','hunter','villager','villager','villager'],10:['alpha','white','wolf','seer','witch','hunter','elder','villager','villager','villager'],11:['alpha','white','wolf','seer','witch','hunter','elder','hybrid','villager','villager','villager'],12:['alpha','white','wolf','seer','witch','hunter','elder','hybrid','angel','villager','villager','villager']};
const questions=['Describe a beautiful memory from your hometown.','What qualities make a good friend?','Describe a skill you would like to learn.','How has technology changed the way people communicate?','Describe a place in nature that you enjoy visiting.','What do you usually do to relax after a busy day?'];
let G=null,tick=null,selected=null;
const app=document.getElementById('app');
function scene(bg='BG Ngày 1.png'){return `background-image:url("${AS+bg}")`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showSetup(){G=null;clearInterval(tick); app.innerHTML=`<div class="scene" style="${scene()}"><div class="wrap"><header class="top"><div class="brand">IWOLF <small>THE IELTS WEREWOLF RPG</small></div><span class="badge">BẢN CHƠI CỤC BỘ</span></header><main class="hero"><section class="panel setup"><h1>ĐÊM XUỐNG TRÊN LÀNG</h1><p class="sub">Một trò chơi Ma Sói nơi mỗi đêm là một lượt luyện IELTS Speaking.<br>Nhập tên người chơi và bắt đầu ván 6–12 người.</p><div class="row"><label class="field">Số người chơi<select id="count" class="input">${Object.keys(configs).map(n=>`<option>${n}</option>`).join('')}</select></label><label class="field">Nhịp chơi<select id="speed" class="input"><option value="normal">Theo luật (30 / 120 / 30 / 180 giây)</option><option value="quick" selected>Demo nhanh (8 / 20 / 8 / 25 giây)</option></select></label></div><div id="names" class="players"></div><div class="notice"><b>Phòng cục bộ trên một thiết bị.</b> Người chơi chuyền thiết bị để xem vai bí mật. Mic và AI chấm Speaking chưa kết nối dịch vụ; người quản trò đánh dấu hoàn thành Speaking trong bản demo.</div><div class="row" style="justify-content:center;margin-top:20px"><button class="btn gold" id="start">BẮT ĐẦU VÁN</button></div><p class="micro center">Không có dữ liệu gửi lên máy chủ. Trạng thái chỉ tồn tại trong phiên trình duyệt hiện tại.</p></section></main></div></div>`; document.getElementById('count').onchange=renderNames;renderNames();document.getElementById('start').onclick=startGame}
function renderNames(){let n=+document.getElementById('count').value;document.getElementById('names').innerHTML=Array.from({length:n},(_,i)=>`<label class="field">Người chơi ${i+1}<input data-name="${i}" value="${escapeHtml(window.IWOLF_PRESET_NAMES?.[i]||`Người chơi ${String.fromCharCode(65+i)}`)}" maxlength="20"></label>`).join('')}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){const names=[...document.querySelectorAll('[data-name]')].map(x=>x.value.trim()||x.defaultValue);let deck=shuffle([...configs[names.length]]);G={players:names.map((name,i)=>({id:i,name,role:deck[i],alive:true,elderLife:2,converted:false,spoke:false,score:null})),testMode:Boolean(window.IWOLF_TEST_MODE),minimumSpeakingScore:Number(window.IWOLF_MIN_SPEAKING_SCORE||5),phase:'reveal',day:1,reveal:0,night:0,angelPrev:null,actions:{},votes:{},witchUsed:false,log:[],speed:document.getElementById('speed').value,question:questions[Math.floor(Math.random()*questions.length)]};if(G.testMode)resetSpeaking(); render()}
function duration(kind){return G.speed==='quick'?({reveal:8,action:20,witch:8,day:25,vote:12}[kind]||8):({reveal:30,action:120,witch:30,day:180,vote:60}[kind]||30)}
function alive(){return G.players.filter(p=>p.alive)}function player(id){return G.players.find(p=>p.id===+id)}function roleImg(r){return AS+roles[r].img}function actionPlayer(p){return p.role==='hybrid'&&p.converted?'wolf':p.role}
function startTimer(kind,cb){clearInterval(tick);G.seconds=duration(kind);render();tick=setInterval(()=>{G.seconds--;let el=document.getElementById('timer');if(el)el.textContent=fmt(G.seconds);if(G.seconds<=0){clearInterval(tick);cb()}},1000)}function fmt(n){return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`}
function log(msg,cls='system'){G.log.unshift({msg,cls});G.log=G.log.slice(0,16)}
function phaseTitle(){return ({reveal:'SÁNG NGÀY 1 · LẬT LÁ BÀI',night:'ĐÊM '+G.day+' · CẦU NGUYỆN SPEAKING',witch:'PHÙ THỦY · 30 GIÂY CUỐI ĐÊM',morning:'CÁO PHÓ ĐÊM '+G.day,discussion:'BUỔI SÁNG · THẢO LUẬN',vote:'BỎ PHIẾU TREO CỔ',execution:'KẾT QUẢ TREO CỔ',gameover:'KẾT THÚC VÁN'})[G.phase]}
function render(){if(!G)return;let bg=G.phase==='night'||G.phase==='witch'?'Đêm BG.jpeg':G.phase==='reveal'?'BG Ngày 1.png':'BG Ngày Thường.jpeg'; app.innerHTML=`<div class="scene" style="${scene(bg)}"><div class="wrap"><header class="top"><div class="brand">IWOLF <small>IELTS WEREWOLF RPG · NGÀY ${G.day}</small></div><div class="row"><span class="badge">${phaseTitle()}</span>${G.seconds!==undefined?`<span class="timer" id="timer">${fmt(G.seconds)}</span>`:''}<button class="btn secondary" id="exit">Thoát ván</button></div></header><div class="phasebar"><span class="micro">${alive().length} người còn sống · ${G.players.length} người chơi</span><span class="micro">Câu hỏi Speaking: “${G.question}”</span></div><div class="gamegrid"><main class="panel mainpanel">${body()}</main><aside class="sidebar"><section class="panel"><h3>Người chơi</h3>${G.players.map(p=>`<div class="alive ${p.alive?'':'dead'}"><span>${escapeHtml(p.name)} ${p.converted?'🐺':''}</span><span>${p.alive?'●':'✝'}</span></div>`).join('')}</section><section class="panel"><h3>Nhật ký làng</h3><div class="chat">${G.log.map(x=>`<div class="${x.cls}">${escapeHtml(x.msg)}</div>`).join('')||'<span class="micro">Chưa có sự kiện.</span>'}</div></section></aside></div></div></div>`;document.getElementById('exit').onclick=()=>{if(confirm('Thoát và xóa trạng thái ván hiện tại?'))showSetup()};bind()}
function body(){if(G.phase==='reveal')return revealBody();if(G.phase==='night')return nightBody();if(G.phase==='witch')return witchBody();if(G.phase==='morning')return morningBody();if(G.phase==='discussion')return discussionBody();if(G.phase==='vote')return voteBody();if(G.phase==='execution')return executionBody();return endBody()}
function revealBody(){let p=G.players[G.reveal];if(!p)return `<h2>Đang chia vai…</h2>`;return `<div class="center"><h2>Chuyền thiết bị cho ${escapeHtml(p.name)}</h2><p class="muted">Chạm lá bài để xem vai bí mật. Hãy giữ kín lá bài của bạn.</p><div class="rolecard back" id="flip"><img src="${AS}WolfCard Back.jpg"><div class="roledesc"><b>IWOLF</b><p>Chạm để lật bài</p></div></div><div id="revealActions" class="hidden"><p class="message">${escapeHtml(roles[p.role].name)}${p.converted?' · PHE SÓI':''}</p><p>${escapeHtml(roles[p.role].text)}</p><button id="nextReveal" class="btn gold">${G.reveal===G.players.length-1?'BẮT ĐẦU ĐÊM 1':'ẨN VAI · CHUYỀN TIẾP'}</button></div></div>`}
function nightBody(){const actions=G.actions;const targets=alive();const complete=alive().filter(p=>['seer','angel','hunter','wolf'].includes(actionPlayer(p))&&!actions[p.id]).length===0;return `<h2>Đêm ${G.day}: cầu nguyện để giữ linh hồn</h2><p class="muted">${G.testMode?`TEST GAME FUNCTION: không cần trả lời IELTS Speaking; điểm tự động 7.0 để qua và tiếp tục test game. Vai trò bí mật thực hiện hành động bên dưới.`:`Mọi người lần lượt nói tiếng Anh theo câu hỏi. Người quản trò đánh dấu hoàn thành sau khi từng người nói; vai trò bí mật thực hiện hành động ở phần dưới.`}</p><div class="notice"><b>SPEAKING QUESTION</b><br>${escapeHtml(G.question)}<br><span class="micro">${G.testMode?`Test Game Function: không cần trả lời; mỗi người tự động đạt 7.0 (yêu cầu ${G.minimumSpeakingScore.toFixed(1)}).`:`Bản demo chưa có nhận dạng giọng nói hoặc chấm AI. Tích “Đã nói” là thao tác quản trò, không phải điểm IELTS.`}</span></div><div class="cards">${alive().map(p=>`<div class="playercard ${p.spoke?'selected':''}" data-spoke="${p.id}"><strong>${escapeHtml(p.name)}</strong><small>${p.spoke?(G.testMode?'✓ 7.0 · TEST':'✓ Đã nói'):'Chạm để đánh dấu đã nói'}</small></div>`).join('')}</div><h3>Hành động đêm</h3><p class="micro">Thiên Sứ không được chọn bản thân hoặc mục tiêu đêm trước. Sói Đầu Đàn có 1.5 phiếu; các Sói khác có 1 phiếu.</p><div class="cards">${G.players.filter(p=>p.alive&&['seer','angel','hunter','wolf'].includes(actionPlayer(p))).map(p=>{let ar=actionPlayer(p);let label=ar==='wolf'?'Chọn mục tiêu cắn':ar==='seer'?'Chọn người soi':ar==='angel'?'Chọn người bảo hộ':'Chọn người ngắm nỏ';return `<label class="field"><span>${escapeHtml(p.name)} · ${roles[ar].name}</span><select data-action="${p.id}" class="input"><option value="">${label}…</option>${targets.filter(t=>ar==='angel'?t.id!==p.id&&t.id!==G.angelPrev:true).map(t=>`<option value="${t.id}" ${actions[p.id]===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}</select></label>`}).join('')}</div><div class="row"><button class="btn gold" id="resolveNight">${complete?'KẾT THÚC 120 GIÂY · XỬ LÝ ĐÊM':'XỬ LÝ ĐÊM NGAY (DEMO)'}</button><button class="btn secondary" id="rollQuestion">Câu hỏi Speaking khác</button></div>`}
function witchBody(){let dead=(G.nightDead||[]).map(id=>player(id));let witch=G.players.find(p=>p.alive&&p.role==='witch');return `<h2>Phù Thủy: xem người đã chết</h2>${dead.length?`<div class="notice">${dead.map(p=>escapeHtml(p.name)).join(', ')} đã mất trong đêm. Chọn tối đa một người để cứu.</div>`:'<div class="notice">Không có ai chết trong đêm. Không cần dùng bình cứu.</div>'}<div class="cards">${dead.filter(p=>p.alive).map(p=>card(p,false)).join('')}</div><p class="micro">${witch?`Đang thao tác thay ${escapeHtml(witch.name)} · chọn tên để cứu.`:'Phù Thủy đã chết.'} Phần Speaking trong bản demo là tự đánh dấu, chưa có điểm AI.</p><div class="row"><button class="btn gold" id="saveWitch" ${!witch||!selected?'disabled':''}>CỨU NGƯỜI ĐƯỢC CHỌN</button><button class="btn secondary" id="skipWitch">BỎ QUA · TIẾP TỤC</button></div>`}
function card(p,click=true){return `<div class="playercard ${p.alive?'':'dead'} ${selected===p.id?'selected':''}" ${click&&p.alive?`data-target="${p.id}"`:''}><img src="${roleImg(p.role)}" alt=""><strong>${escapeHtml(p.name)}</strong><small>${p.alive?'Còn sống':'Đã chết'}</small></div>`}
function morningBody(){let dead=(G.nightDead||[]).map(id=>player(id));return `<div class="grave"><div>📜</div><h2>CÁO PHÓ ĐÊM QUA</h2>${dead.length?dead.map(p=>`<p class="message">${escapeHtml(p.name)}</p>`).join(''):'<p class="message">Đêm qua không ai mất mạng.</p>'}<p class="micro">Không hiển thị nguyên nhân tử vong.</p></div>${G.convertedNotice?`<div class="notice" style="margin-top:14px">🐺 “Bạn bị sói cắn trong đêm nhưng không mất mạng. Dòng máu sói trong bạn đã thức tỉnh. Bạn trở thành Sói vào các đêm tiếp theo.”</div>`:''}<h3 style="margin-top:20px">Phân tích Speaking · bản demo</h3><div class="notice">${G.testMode?`Test Game Function: mọi người tự động đạt 7.0 để tiếp tục test; không cần trả lời Speaking.`:`Chưa kết nối AI chấm điểm. Mức yêu cầu hiện được lưu cho phòng nhưng chưa được tự động kiểm tra; dữ liệu phản ánh người quản trò đánh dấu Speaking, không tính điểm trung bình.`}</div><table class="score"><tr><th>Người chơi</th><th>Trạng thái</th><th>Điểm</th></tr>${G.players.map(p=>`<tr><td>${escapeHtml(p.name)}</td><td>${p.spoke?'Đã nói':'Chưa đánh dấu'}</td><td>${p.score===null?'—':p.score.toFixed(1)}</td></tr>`).join('')}</table><div class="row" style="margin-top:18px"><button id="startDay" class="btn gold">BẮT ĐẦU THẢO LUẬN</button></div>`}
function discussionBody(){return `<h2>Buổi sáng · thảo luận</h2><p class="message">Cả làng có ${G.seconds===undefined?'3 phút':fmt(G.seconds)} để trao đổi, suy luận và luyện nói tiếng Anh.</p><div class="notice">Hãy dùng nội dung Speaking đêm qua làm manh mối. Trò chơi cục bộ không mở voice room; mọi người thảo luận trực tiếp quanh cùng một thiết bị.</div><div class="row" style="margin-top:22px"><button class="btn gold" id="goVote">BỎ PHIẾU TREO CỔ</button></div>`}
function voteBody(){let voters=alive();return `<h2>Bỏ phiếu treo cổ</h2><p class="muted">Mỗi người sống chọn một người khác hoặc bỏ lượt. Nếu hòa phiếu cao nhất, không ai bị treo.</p><div class="cards">${voters.map(p=>`<label class="field">${escapeHtml(p.name)}<select data-vote="${p.id}" class="input"><option value="skip">Bỏ lượt</option>${voters.filter(t=>t.id!==p.id).map(t=>`<option value="${t.id}" ${G.votes[p.id]===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}</select></label>`).join('')}</div><button class="btn gold" id="tally">CHỐT PHIẾU</button>`}
function executionBody(){if(!G.executed)return `<h2>Không ai bị treo cổ</h2><p class="message">Phiếu cao nhất bị hòa. Làng bước sang đêm tiếp theo.</p><button class="btn gold" id="nextNight">ĐI ĐẾN ĐÊM ${G.day+1}</button>`;let p=player(G.executed);return `<h2>🔥 Kết quả treo cổ</h2><p class="message">${escapeHtml(p.name)} bị cả làng đặt lên dàn thiêu.</p><div class="notice">${G.executionText}</div>${G.hunterTarget!==undefined?`<div class="notice" style="margin-top:10px">Phát nỏ của Thợ Săn: ${G.hunterTarget===null?'không có mục tiêu':escapeHtml(player(G.hunterTarget).name)}</div>`:''}<div style="margin-top:20px"><button class="btn gold" id="afterExec">TIẾP TỤC</button></div>`}
function endBody(){return `<div class="center"><h2>🏆 ${G.winner==='wolf'?'PHE SÓI CHIẾN THẮNG':'PHE DÂN CHIẾN THẮNG'}</h2><p class="message">${G.winner==='wolf'?'Số Sói còn sống đã ngang bằng hoặc vượt số người phe Dân.':'Tất cả Sói đã bị loại khỏi làng.'}</p><h3>Danh tính các vai</h3><div class="cards">${G.players.map(p=>`<div class="playercard"><img src="${roleImg(p.role)}"><strong>${escapeHtml(p.name)}</strong><small>${roles[p.role].name}${p.converted?' · Sói thức tỉnh':''}</small></div>`).join('')}</div><button class="btn gold" id="restart">VỀ SẢNH</button></div>`}
function bind(){if(G.phase==='reveal'){document.getElementById('flip').onclick=()=>{const p=G.players[G.reveal];document.getElementById('flip').innerHTML=`<img src="${roleImg(p.role)}"><div class="roledesc"><b>${roles[p.role].name}</b><p>${roles[p.role].text}</p></div>`;document.getElementById('revealActions').classList.remove('hidden')};document.getElementById('nextReveal').onclick=()=>{G.reveal++;if(G.reveal>=G.players.length){G.phase='night';G.question=questions[Math.floor(Math.random()*questions.length)];resetSpeaking();startTimer('action',resolveNight)}else render()};if(G.seconds===undefined)startTimer('reveal',()=>{G.reveal++;if(G.reveal>=G.players.length){G.phase='night';G.question=questions[Math.floor(Math.random()*questions.length)];resetSpeaking();startTimer('action',resolveNight)}else render()})}
if(G.phase==='night'){document.querySelectorAll('[data-spoke]').forEach(e=>e.onclick=()=>{if(G.testMode)return;let p=player(e.dataset.spoke);p.spoke=!p.spoke;p.score=null;render()});document.querySelectorAll('[data-action]').forEach(e=>e.onchange=()=>{G.actions[e.dataset.action]=e.value===''?undefined:+e.value});document.getElementById('rollQuestion').onclick=()=>{G.question=questions[Math.floor(Math.random()*questions.length)];render()};document.getElementById('resolveNight').onclick=()=>{clearInterval(tick);resolveNight()}}
if(G.phase==='witch'){document.querySelectorAll('[data-target]').forEach(e=>e.onclick=()=>{selected=+e.dataset.target;render()});document.getElementById('saveWitch').onclick=()=>{if(selected!==null){player(selected).alive=true;G.nightDead=G.nightDead.filter(x=>x!==selected);log('Phù Thủy đã cứu một người.');selected=null;G.witchUsed=true;finishNight()}};document.getElementById('skipWitch').onclick=()=>{selected=null;G.witchUsed=true;finishNight()};if(G.seconds===undefined)startTimer('witch',()=>{G.witchUsed=true;finishNight()})}
if(G.phase==='morning')document.getElementById('startDay').onclick=()=>{G.phase='discussion';startTimer('day',()=>{G.phase='vote';G.votes={};startTimer('vote',finishVote)})};if(G.phase==='discussion')document.getElementById('goVote').onclick=()=>{clearInterval(tick);G.phase='vote';G.votes={};startTimer('vote',finishVote)};if(G.phase==='vote'){document.querySelectorAll('[data-vote]').forEach(e=>e.onchange=()=>G.votes[e.dataset.vote]=e.value==='skip'?'skip':+e.value);document.getElementById('tally').onclick=()=>{clearInterval(tick);finishVote()}}
if(G.phase==='execution'){if(!G.executed)document.getElementById('nextNight').onclick=nextNight;else {document.getElementById('afterExec').onclick=()=>{if(checkWinner())return;if(G.hunterTarget!==undefined&&G.hunterTarget!==null){let target=player(G.hunterTarget);if(target.alive){if(target.role==='white')log('Sói Trắng miễn nhiễm với phát nỏ của Thợ Săn.');else damageTarget(target,'Thợ Săn bắn nỏ')}G.hunterTarget=null;if(checkWinner())return}nextNight()}}}if(G.phase==='gameover')document.getElementById('restart').onclick=showSetup}
function resetSpeaking(){G.players.forEach(p=>{p.spoke=Boolean(G.testMode);p.score=G.testMode?7.0:null})}
function resolveNight(){clearInterval(tick);let protection=null,angel=G.players.find(p=>p.alive&&p.role==='angel');if(angel&&G.actions[angel.id]!==undefined){protection=G.actions[angel.id];G.angelPrev=protection}let wolves=G.players.filter(p=>p.alive&&actionPlayer(p)==='wolf'&&G.actions[p.id]!==undefined);let totals={};wolves.forEach(p=>{let target=G.actions[p.id];totals[target]=(totals[target]||0)+(p.role==='alpha'?1.5:1)});let kill=null;if(Object.keys(totals).length){let max=Math.max(...Object.values(totals));let ties=Object.keys(totals).filter(id=>totals[id]===max);kill=+ties[Math.floor(Math.random()*ties.length)]}let dead=[];G.convertedNotice=false;if(kill!==null&&kill!==protection){let target=player(kill);if(target.role==='elder'){damageTarget(target,'Sói cắn');if(!target.alive)dead.push(target.id)}else if(target.role==='hybrid'&&!target.converted){target.converted=true;G.convertedNotice=true;log('Một dòng máu sói đã thức tỉnh.','wolf')}else{target.alive=false;dead.push(target.id);log(`${target.name} đã mất tích trong đêm.`)}}else if(kill!==null&&kill===protection)log('Thiên Sứ đã vô hiệu hóa đòn cắn.');
let hunter=G.players.find(p=>p.role==='hunter');G.hunterTarget=hunter?G.actions[hunter.id]??null:undefined;G.protectedTarget=protection;
let missed=alive().filter(p=>!p.spoke);for(let p of missed){if(p.role==='hybrid'&&!p.converted){p.converted=true;G.convertedNotice=true;continue}p.alive=false;dead.push(p.id);log(`${p.name} không hoàn thành Speaking và mất linh hồn.`)}
let seer=G.players.find(p=>p.alive&&p.role==='seer');if(seer&&G.actions[seer.id]!==undefined){let t=player(G.actions[seer.id]);log(`Tiên Tri soi ${t.name}: ${t.role==='white'?'phe Dân':t.converted||roles[t.role].team==='wolf'?'phe Sói':'phe Dân'}.`)}G.nightDead=[...new Set(dead)];G.actions={};G.phase='witch';G.seconds=undefined;selected=null;render()}
function damageTarget(target,cause){if(!target||!target.alive)return false;if(target.role==='elder'&&target.elderLife>0){target.elderLife--;log(`Già Làng bị ${cause} và mất một mạng (${target.elderLife} còn lại).`);if(target.elderLife>0)return false}target.alive=false;log(`${target.name} đã chết.`);return true}
function finishNight(){clearInterval(tick);let hunter=G.players.find(p=>p.role==='hunter');if(hunter&&!hunter.alive&&G.hunterTarget!==undefined&&G.hunterTarget!==null){let target=player(G.hunterTarget);if(target.alive&&target.id!==G.protectedTarget){if(target.role==='white')log('Sói Trắng miễn nhiễm với phát nỏ của Thợ Săn.');else if(damageTarget(target,'Thợ Săn bắn nỏ'))G.nightDead.push(target.id);log('Thợ Săn ngã xuống và phát nỏ trúng mục tiêu.')}else if(target.id===G.protectedTarget)log('Thiên Sứ đã chặn phát nỏ.');G.hunterTarget=null}G.phase='morning';G.seconds=undefined;render()}
function finishVote(){clearInterval(tick);let tally={};alive().forEach(p=>{let v=G.votes[p.id]??'skip';if(v!=='skip')tally[v]=(tally[v]||0)+1});let ids=Object.keys(tally);if(!ids.length){G.executed=null}else{let max=Math.max(...Object.values(tally));let tops=ids.filter(id=>tally[id]===max);G.executed=tops.length===1?+tops[0]:null}if(G.executed!==null){let p=player(G.executed);p.alive=false;if(p.role==='elder'){G.players.filter(x=>x.alive&&x.role!=='villager'&&!['wolf','alpha','white'].includes(x.role)).forEach(x=>x.role='villager');G.executionText='Một cảm giác khác lạ khi ánh lửa dần lụi tàn. Phe dân đã mất toàn bộ năng lực đặc biệt.'}else if(actionPlayer(p)==='wolf'||roles[p.role].team==='wolf'||p.converted)G.executionText='Tiếng hò reo của người dân ngân vang khi họ nghe tiếng tru thảm thiết của một CON SÓI.';else G.executionText='Trong ánh lửa lụi dần trên dàn hỏa thiêu lộ ra tro tàn một NGƯỜI DÂN vô tội.';if(p.role==='hunter'&&G.hunterTarget!==undefined&&G.hunterTarget!==null){let target=player(G.hunterTarget);if(target.alive){target.alive=false;log('Thợ Săn bị treo cổ và phát nỏ trúng mục tiêu.')}G.hunterTarget=null}log(`${p.name} bị cả làng đặt lên dàn thiêu.`)}else{G.executionText='';log('Phiếu cao nhất hòa; không ai bị treo cổ.')}G.phase='execution';G.seconds=undefined;render()}
function nextNight(){G.day++;G.phase='night';G.votes={};G.actions={};G.nightDead=[];G.question=questions[Math.floor(Math.random()*questions.length)];resetSpeaking();startTimer('action',resolveNight)}
function checkWinner(){let wolf=alive().filter(p=>roles[actionPlayer(p)].team==='wolf'||p.converted).length;let village=alive().length-wolf;if(!wolf){G.winner='village';G.phase='gameover';G.seconds=undefined;render();return true}if(wolf>=village){G.winner='wolf';G.phase='gameover';G.seconds=undefined;render();return true}return false}
showSetup();
</script><script src="online.js?v=6"></script></body></html>
